<!doctype html>
<!--
  Hayaki's card host page: the only page the study screen's web view loads,
  served at hayaki-card://card/ (see CardResources.swift), so card HTML
  finds the collection's media by plain relative names and the bundled
  MathJax under /_hayaki/. Nothing is loaded from the network.

  Native code shows a card side with hayaki.show({html, css, bodyClass,
  isAnswer}). hayaki.language(lang) sets <html lang>. The page posts to the "hayaki" message handler:
    "tap"               a tap on the card, not on a link or control
    {play: "q:0"}       a tap on a replay button
    {typed: "…"}        the text typed into a typed-answer field, as it changes
    {submit: true}      Return pressed in that field
    {rendered: token}   the requested side's HTML is installed
  The classes on <html> and <body> follow desktop Anki's reviewer, so card
  styling written for Anki applies here too: <body class="card card1"> and,
  in dark mode, "nightMode night_mode" on <body> and "night-mode" on <html>.
  Several rules below are those of Anki's reviewer (ts/reviewer/reviewer.scss,
  AGPL-3.0-or-later, Ankitects Pty Ltd and contributors).
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
    :root {
        --canvas: #ffffff;
        --fg: #000000;
        --border: #c6c6c8;
        --replay-fill: #ffffff;
        --replay-ink: #414141;
        -webkit-text-size-adjust: 100%;
        /* Cards whose template names no font use the system font. Set on
           the root, not on .card, so any font the template sets wins. Han
           characters follow <html lang> (the Card Kanji/Hanzi Style
           setting): Hiragino Sans for ja, PingFang for zh. */
        font-family: system-ui, -apple-system, sans-serif;
    }
    :root.night-mode {
        --canvas: var(--hayaki-night-canvas, #000000);
        --fg: #ffffff;
        --border: #38383a;
        --replay-fill: #2c2c2e;
        --replay-ink: #e5e5ea;
    }
    /* No background of our own: the card's (or, in dark mode, the canvas
       colour below) fills the page, and without one the native background
       shows through the transparent web view. */
    body {
        margin: 20px;
        overflow-wrap: break-word;
        color: var(--fg);
        -webkit-tap-highlight-color: transparent;
    }
    /* As in Anki: overrides the note type's .card colours in dark mode. */
    body.nightMode {
        background-color: var(--canvas);
        color: var(--fg);
    }
    hr {
        background-color: var(--border);
        margin: 1em 0;
        border: none;
        height: 1px;
    }
    /* Images and videos never overflow the screen; a box squeezed by these
       limits keeps the picture's proportions. */
    img {
        max-width: 100%;
        max-height: 95vh;
        object-fit: contain;
    }
    .reviewer-input {
        touch-action: manipulation;
    }
    .reviewer-hide-audio .replay-button {
        display: none;
    }
    .reviewer-reduced-motion *, .reviewer-reduced-motion *::before, .reviewer-reduced-motion *::after {
        animation-duration: 0s !important;
        transition-duration: 0s !important;
        scroll-behavior: auto !important;
    }
    .reviewer-centered {
        min-height: calc(100vh - 40px);
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    img {
        zoom: var(--reviewer-image-zoom, 1);
    }
    video {
        max-width: 100%;
        height: auto;
    }
    li {
        text-align: start;
    }
    pre {
        text-align: left;
        overflow-x: auto;
    }
    /* The stock Anki note type places the image and mask canvas together. */
    #image-occlusion-container {
        position: relative;
        margin-inline: auto;
        max-height: calc(95vh - 40px);
    }
    #image-occlusion-container img, #image-occlusion-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
    }
    /* Typed answers, as in Anki. */
    #typeans {
        width: 100%;
        box-sizing: border-box;
        line-height: 1.75;
    }
    input#typeans {
        font: inherit;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--fg);
        background: transparent;
        caret-color: var(--hayaki-accent, auto);
    }
    /* The focus ring uses the theme accent rather than system blue. */
    input#typeans:focus {
        outline: 2px solid var(--hayaki-accent, -webkit-focus-ring-color);
        outline-offset: -1px;
    }
    code#typeans {
        white-space: pre-wrap;
        font-variant-ligatures: none;
    }
    .typeGood {
        background: #afa;
        color: black;
    }
    .typeBad {
        color: black;
        background: #faa;
    }
    .typeMissed {
        color: black;
        background: #ccc;
    }
    /* Replay buttons, as in Anki. */
    .replay-button {
        text-decoration: none;
        display: inline-flex;
        vertical-align: middle;
        margin: 3px;
    }
    .replay-button svg {
        width: 40px;
        height: 40px;
    }
    .replay-button svg circle {
        fill: var(--replay-fill);
        stroke: var(--replay-ink);
    }
    .replay-button svg path {
        fill: var(--replay-ink);
    }
    .nightMode .latex {
        filter: invert(100%);
    }
    /* Wide maths scrolls sideways instead of overflowing the screen. */
    mjx-container[display="true"] {
        overflow-x: auto;
        overflow-y: hidden;
    }
</style>
<style id="card-style"></style>
<script src="/_hayaki/card-template.js"></script>
<script src="/_hayaki/image-occlusion.js"></script>
</head>
<body class="card">
<div id="qa"></div>
<script>
(function () {
    "use strict";

    const dark = window.matchMedia("(prefers-color-scheme: dark)");
    let shownBodyClass = "card";
    let legacyDark = dark.matches;

    function post(message) {
        window.webkit?.messageHandlers?.hayaki?.postMessage(message);
    }

    function applyColorScheme() {
        const night = dark.matches;
        document.documentElement.classList.toggle("night-mode", night);
        const settings = Array.from(document.body.classList).filter(name => name.startsWith("reviewer-"));
        document.body.className = shownBodyClass + (night ? " nightMode night_mode" : "");
        document.body.classList.toggle("ankidroid_dark_mode", night && legacyDark);
        document.body.classList.add(...settings);
    }

    // The page language picks Japanese or Chinese glyph forms for Han
    // characters; an empty string leaves it unset.
    function language(lang) {
        if (lang) {
            document.documentElement.lang = lang;
        } else {
            document.documentElement.removeAttribute("lang");
        }
    }

    function appearance(canvas, isLegacyDark, accent) {
        legacyDark = isLegacyDark;
        document.documentElement.style.setProperty("--hayaki-night-canvas", canvas);
        if (accent) document.documentElement.style.setProperty("--hayaki-accent", accent);
        applyColorScheme();
    }

    // Scripts inserted with innerHTML do not run; replace each with a fresh
    // copy, in order, as Anki's reviewer does, so card scripts work.
    function runScripts(container) {
        for (const old of container.querySelectorAll("script")) {
            const script = document.createElement("script");
            for (const attribute of old.attributes) {
                script.setAttribute(attribute.name, attribute.value);
            }
            script.text = old.text;
            old.replaceWith(script);
        }
    }

    // MathJax, bundled with the app, is loaded the first time a card has
    // maths, configured as Anki configures it (ts/mathjax/index.ts).
    const mathPattern = /\\\[(.*?)\\\]|\\\((.*?)\\\)/su;
    let mathJaxLoading = null;

    function loadMathJax() {
        if (!mathJaxLoading) {
            mathJaxLoading = new Promise(function (resolve, reject) {
                window.MathJax = {
                    tex: {
                        displayMath: [["\\[", "\\]"]],
                        processEscapes: false,
                        processEnvironments: false,
                        processRefs: false,
                        packages: { "[+]": ["noerrors", "mathtools"], "[-]": ["textmacros"] },
                    },
                    loader: {
                        load: ["[tex]/noerrors", "[tex]/mathtools"],
                        paths: { mathjax: "/_hayaki/mathjax" },
                    },
                    startup: { typeset: false },
                };
                const script = document.createElement("script");
                script.src = "/_hayaki/mathjax/tex-chtml-full.js";
                script.onload = function () { resolve(); };
                script.onerror = function () { reject(new Error("MathJax did not load")); };
                document.head.appendChild(script);
            });
        }
        return mathJaxLoading;
    }

    async function typesetMaths(container) {
        await loadMathJax();
        await window.MathJax.startup.promise;
        window.MathJax.typesetClear();
        await window.MathJax.typesetPromise([container]);
    }

    async function render(side, token, focusTypedAnswer) {
        document.getElementById("card-style").textContent = side.css;
        shownBodyClass = side.bodyClass;
        applyColorScheme();
        const qa = document.getElementById("qa");
        const hasMaths = mathPattern.test(side.html);
        // Hidden until the maths is drawn, so raw TeX never flashes up.
        qa.style.opacity = hasMaths ? "0" : "1";
        qa.innerHTML = side.html;
        post({ rendered: token });
        window.hayakiTemplate?.begin(token);
        runScripts(qa);
        if (hasMaths) {
            try {
                await typesetMaths(qa);
            } catch (error) {
                console.error(error);
            }
            qa.style.opacity = "1";
        }
        const answer = side.isAnswer ? document.getElementById("answer") : null;
        if (answer && document.documentElement.scrollHeight > window.innerHeight) {
            answer.scrollIntoView({ block: "start" });
        } else {
            window.scrollTo(0, 0);
        }
        const typeans = document.querySelector("input#typeans");
        if (typeans) {
            typeans.addEventListener("input", function () {
                post({ typed: typeans.value });
            });
            typeans.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    post({ typed: typeans.value });
                    post({ submit: true });
                }
            });
            if (focusTypedAnswer) typeans.focus();
        }
    }

    // Sides are drawn one after another, so a quick turn of the card never
    // lets an older side finish drawing over a newer one.
    let drawing = Promise.resolve();

    function show(side, token, focusTypedAnswer = true) {
        drawing = drawing.then(function () { return render(side, token, focusTypedAnswer); }).catch(console.error);
    }

    dark.addEventListener("change", applyColorScheme);
    applyColorScheme();

    document.addEventListener("click", function (event) {
        if (!(event.target instanceof Element)) {
            return;
        }
        const replay = event.target.closest(".replay-button[data-play]");
        if (replay) {
            event.preventDefault();
            post({ play: replay.getAttribute("data-play") });
            return;
        }
        const interactive = "a, button, input, textarea, select, summary, label, audio, video, [onclick]";
        if (event.target.closest(interactive)) {
            return;
        }
        post("tap");
    });

    window.hayaki = { show, appearance, language };
})();
</script>
</body>
</html>
