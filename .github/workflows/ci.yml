name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        # The Anki submodule is fetched by scripts/build-core.sh, and only when
        # the core is not already cached.

      - name: Read the pinned Anki commit
        id: anki
        run: echo "commit=$(git rev-parse HEAD:vendor/anki)" >> "$GITHUB_OUTPUT"

      - name: Restore the built core
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: &core-paths |
            build/core/descriptors.bin
            Packages/AnkiCore/Frameworks
            Packages/AnkiCore/Sources/AnkiCore/Generated
            Packages/AnkiCore/Sources/AnkiProto/Generated
          key: core-${{ runner.os }}-${{ steps.anki.outputs.commit }}-${{ hashFiles('core/**', 'scripts/build-core.sh', 'Packages/AnkiCore/Package.resolved') }}

      # Upstream's sync server, which the SyncFeature tests sync against.
      - name: Restore the sync server
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: build/sync-server/anki-sync-server
          key: sync-server-${{ runner.os }}-${{ steps.anki.outputs.commit }}-${{ hashFiles('scripts/build-sync-server.sh') }}

      - name: Install build tools
        run: brew install xcodegen protobuf

      # Each build is saved straight away, so a later failing step does not
      # throw away a build that takes most of an hour.
      - name: Build the core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: scripts/build-core.sh

      - name: Save the built core
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *core-paths
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

      - name: Build the sync server
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: scripts/build-sync-server.sh

      - name: Save the sync server
        if: steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/sync-server/anki-sync-server
          key: ${{ steps.server-cache.outputs.cache-primary-key }}

      - name: Run the package tests
        run: scripts/test.sh

      - name: Build the app for the iOS simulator
        run: |
          xcodegen generate
          xcodebuild build \
            -project Hayaki.xcodeproj \
            -scheme Hayaki \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
