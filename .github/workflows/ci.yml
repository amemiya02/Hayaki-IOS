name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build the core and the app, run the tests
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@v4
        # The Anki submodule is fetched by scripts/build-core.sh, and only when
        # the core is not already cached.

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Compute the core's cache key
        id: core-key
        # The built core depends on the pinned Anki commit, our bridge and code
        # generator, the Rust toolchain and lock file, the build script and the
        # pinned swift-protobuf version.
        run: |
          anki_commit="$(git rev-parse HEAD:vendor/anki)"
          echo "anki=$anki_commit" >> "$GITHUB_OUTPUT"
          echo "Pinned Anki commit: $anki_commit"

      - name: Restore the built core
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/core/descriptors.bin
            Packages/AnkiCore/Frameworks
            Packages/AnkiCore/Sources/AnkiCore/Generated
            Packages/AnkiCore/Sources/AnkiProto/Generated
          key: core-${{ runner.os }}-${{ steps.core-key.outputs.anki }}-${{ hashFiles('core/**', 'scripts/build-core.sh', 'Packages/AnkiCore/Package.resolved') }}

      # Upstream's sync server, which the SyncFeature tests sync against. It
      # depends only on the pinned Anki commit and its build script.
      - name: Restore the sync server
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: build/sync-server/anki-sync-server
          key: sync-server-${{ runner.os }}-${{ steps.core-key.outputs.anki }}-${{ hashFiles('scripts/build-sync-server.sh') }}

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          if [[ "${{ steps.core-cache.outputs.cache-hit }}" != "true" || "${{ steps.server-cache.outputs.cache-hit }}" != "true" ]]; then
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi

      - name: Build the core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: scripts/build-core.sh

      # Saved straight away, so a later failing step does not throw away a
      # build that takes most of an hour.
      - name: Save the built core
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/core/descriptors.bin
            Packages/AnkiCore/Frameworks
            Packages/AnkiCore/Sources/AnkiCore/Generated
            Packages/AnkiCore/Sources/AnkiProto/Generated
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

      - name: Build the sync server
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: scripts/build-sync-server.sh

      - name: Save the sync server
        if: steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/sync-server/anki-sync-server
          key: ${{ steps.server-cache.outputs.cache-primary-key }}

      - name: Run the tests on the Mac
        run: scripts/test.sh

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for the iOS simulator
        run: |
          xcodebuild build \
            -project Hayaki.xcodeproj \
            -scheme Hayaki \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run the iPhone and iPad user-interface tests
        if: github.ref == 'refs/heads/hayaki-v1'
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail

          select_simulator() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          family, preferred = sys.argv[1:]
          available = [
              device for runtime, devices in json.load(sys.stdin)["devices"].items()
              if ".iOS-" in runtime
              for device in devices if device["isAvailable"] and device["name"].startswith(family)
          ]
          if not available:
              sys.exit("No available iOS " + family + " simulator")
          print(next((device for device in available if device["name"] == preferred), available[0])["udid"])
          ' "$1" "$2"
          }

          run_ui_tests() {
            simulator="$1"
            result="$2"
            shift 2
            xcodebuild test \
              -project Hayaki.xcodeproj \
              -scheme Hayaki \
              -destination "platform=iOS Simulator,id=$simulator" \
              -derivedDataPath build/DerivedData \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 240 \
              -resultBundlePath "build/$result.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              "$@"
          }

          phone=$(select_simulator iPhone "iPhone 17")
          tablet=$(select_simulator iPad "iPad Pro 11-inch (M5)")
          phone_result=0
          run_ui_tests "$phone" UITests-iPhone || phone_result=$?
          xcrun simctl shutdown "$phone" || true
          tablet_result=0
          run_ui_tests "$tablet" UITests-iPad -only-testing:HayakiUITests/NavigationUITests || tablet_result=$?
          xcrun simctl shutdown "$tablet" || true

          if (( phone_result != 0 || tablet_result != 0 )); then
            exit 1
          fi

      - name: Keep simulator results
        if: always() && github.ref == 'refs/heads/hayaki-v1'
        uses: actions/upload-artifact@v4
        with:
          name: hayaki-simulator-results
          path: build/UITests-*.xcresult
          if-no-files-found: ignore
