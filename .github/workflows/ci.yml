name: Focused joint-release device validation

on:
  push:
    branches: [codex/v020-device-gate]

jobs:
  devices:
    name: Verify ${{ matrix.family }} study
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPhone
            model: "iPhone 18 Pro"
          - family: iPad
            model: "iPad Pro 11-inch (M5)"
    env:
      CANDIDATE: 7c55d9d8f8591121899c39fc9b5abeb7bd857b89
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE }}

      - name: Record the checkout and shared fixture
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git rev-parse HEAD
          shasum -a 256 Packages/CollectionStore/Sources/CollectionTesting/Fixtures/collection.colpkg
          xcodebuild -version

      - name: Compute the core's cache key
        id: core-key
        # The built core depends on the pinned Anki commit, our bridge and code
        # generator, the Rust toolchain and lock file, the build script and the
        # pinned swift-protobuf version.
        run: |
          anki_commit="$(git rev-parse HEAD:vendor/anki)"
          echo "anki=$anki_commit" >> "$GITHUB_OUTPUT"
          echo "Pinned Anki commit: $anki_commit"

      - name: Restore the built core
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/core/descriptors.bin
            Packages/AnkiCore/Frameworks
            Packages/AnkiCore/Sources/AnkiCore/Generated
            Packages/AnkiCore/Sources/AnkiProto/Generated
          key: core-${{ runner.os }}-${{ steps.core-key.outputs.anki }}-${{ hashFiles('core/**', 'scripts/build-core.sh', 'Packages/AnkiCore/Package.resolved') }}

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          if [[ "${{ steps.core-cache.outputs.cache-hit }}" != "true" ]]; then
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi

      - name: Build the core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: scripts/build-core.sh

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app and tests for the iOS simulator
        run: |
          xcodebuild build-for-testing \
            -project Hayaki.xcodeproj \
            -scheme Hayaki \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO

      - name: Run the shared installed-app scenarios
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          test_configuration=$(find build/DerivedData/Build/Products -maxdepth 1 -name 'Hayaki_iphonesimulator*-arm64.xctestrun' -print -quit)
          [[ -f "$test_configuration" ]]
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          family, preferred = os.environ["FAMILY"], os.environ["MODEL"]
          devices = [device for runtime, devices in json.load(sys.stdin)["devices"].items()
                     if ".iOS-" in runtime for device in devices if device["name"].startswith(family)]
          print(next((device for device in devices if device["name"] == preferred), devices[0])["udid"])
          ')
          xcrun simctl bootstatus "$simulator" -b
          tests=(-only-testing:HayakiUITests/StudyUITests/testStudyAllFinishesOneDeckAndAllowsAnEarlyExitFromTheNext)
          if [[ "$FAMILY" == "iPhone" ]]; then
            tests+=(-only-testing:HayakiUITests/HelpAndAboutUITests/testAboutIdentifiesThisBuildAndOpensItsChangelog)
          fi
          xcodebuild test-without-building \
            -xctestrun "$test_configuration" \
            -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -resultBundlePath "build/UITests-$FAMILY.xcresult" \
            CODE_SIGNING_ALLOWED=NO "${tests[@]}" 2>&1 | tee "build/UITests-$FAMILY.log"

      - name: Archive device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-results-${{ matrix.family }}
          path: |
            build/UITests-*.xcresult
            build/UITests-*.log
          if-no-files-found: ignore
